spring.application.name=caps



# Banco de dados
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_SCHEMA:CAPS}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Root@123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= update
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Ignorar erros de constraint durante schema update
# spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor
# spring.jpa.properties.hibernate.hbm2ddl.import_files= 

# # Desabilitar verificação de chaves estrangeiras temporariamente
# ## ATENCAO: REMOVER PARA PRODUCAO
# spring.datasource.hikari.connection-init-sql=SET FOREIGN_KEY_CHECKS=0

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Opcional: desative em produção
spring.jackson.serialization.fail-on-empty-beans=false

# Log do spring security
logging.level.org.springframework.security=DEBUG

# Variável de ambiente
api.security.token.secret=${JWT_SECRET:my-secret-key}

# Admin super
admin.email=${ADMIN_EMAIL:lyrasolfieri@gmail.com}
admin.password=${ADMIN_PASSWORD:12345678#}

# Configuração de migrations
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.database-type=mysql

# Microserviço de OCR (FastAPI + Docling)
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8000}
